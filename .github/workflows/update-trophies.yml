name: Update Trophy SVGs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest SVGs
        run: |
          mkdir -p assets
          code_trophy=$(curl -sL -o assets/trophy.svg -w "%{http_code}" "https://trophy.ryglcloud.net/?username=cuic19053-hue&theme=dracula&no-frame=true&no-bg=true&margin-w=4&column=7")
          echo "trophy: $code_trophy"
          code_stats=$(curl -sL -o assets/stats.svg -w "%{http_code}" "https://github-readme-stats.shion.dev/api?username=cuic19053-hue&show_icons=true&theme=dark&hide_border=true&bg_color=0D1117&title_color=C084FC&text_color=CBD5E1&icon_color=A855F7&border_radius=8")
          echo "stats: $code_stats"
          code_streak=$(curl -sL -o assets/streak.svg -w "%{http_code}" "https://streak-stats.demolab.com/?user=cuic19053-hue&theme=dark&hide_border=true&background=0D1117&ring=A855F7&fire=C084FC&currStreakLabel=38BDF8")
          echo "streak: $code_streak"
          code_langs=$(curl -sL -o assets/top-langs.svg -w "%{http_code}" "https://github-readme-stats.shion.dev/api/top-langs/?username=cuic19053-hue&layout=compact&theme=dark&hide_border=true&bg_color=0D1117&title_color=C084FC&text_color=CBD5E1&border_radius=8")
          echo "top-langs: $code_langs"
          echo "trophy:$code_trophy stats:$code_stats streak:$code_streak top-langs:$code_langs" > assets/fetch-status.txt
          test "$code_trophy" = "200" && test "$code_stats" = "200" && test "$code_streak" = "200" && test "$code_langs" = "200"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile SVGs"
            git push
          fi
